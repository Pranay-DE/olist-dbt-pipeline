version: 2

models:
  - name: olist_master_table
    description: "Wide master table at order-item grain combining all business entities.
                  One row per order_id + product_id combination. Use COUNT(DISTINCT order_id) for order level metrics.
                  Invalid date orders excluded."
    columns:
      - name: order_id
        description: "Order identifier. Not unique at this grain — repeats for each item in the order."
        tests:
          - not_null

      - name: order_item_id
        description: "Item sequence number within order."

      - name: product_id
        description: "Product Identifier"

      - name: customer_id
        description: "Customer identifier per order."
        tests:
          - not_null

      - name: price
        description: "Item price in BRL."

      - name: total_item_value
        description: "Price + freight for this item."

  - name: sales_performance
    description: "Sales performance aggregated by product category, fiscal year and month.
                  Grain: one row per product_category + fiscal_year + order_month."
    columns:
      - name: product_category
        description: "Product category in English."
        tests:
          - not_null

      - name: fiscal_year
        description: "Fiscal Year of Order"
        tests:
          - not_null

      - name: order_month
        description: "Month number of the order (1-12)."
        tests:
          - not_null

      - name: total_orders
        description: "Count of distinct orders for this category/month."
        tests:
          - not_null

      - name: total_revenue
        description: "Sum of item prices (excluding freight)."
        tests:
          - not_null

      - name: total_value
        description: "Sum of items prices (revenue + freight)"
        tests:
          - not_null

  - name: customer_behaviour
    description: "Customer-level behaviour table at customer_unique_id grain.
                  One row per unique customer with aggregated spend, orders, reviews, delivery, and preferred payment method
                  Preferred payment = most frequently used mode; ties broken alphabetically."
    columns:
      - name: customer_unique_id
        description: "True customer identity (primary key)"
        tests:
          - not_null
    
      - name: customer_city
        description: "Customer's city"
        tests:
          - not_null

      - name: customer_state
        description: "Customer's state code"
        tests:
          - not_null

      - name: customer_type
        description: "New Customer or Repeat Customer"
        tests:
          - not_null
          - accepted_values:
              values: ['New Customer', 'Repeat Customer']

      - name: total_spend
        description: "Total lifetime spend by customer"

      - name: total_orders
        description: "Distinct count of customer's orders"
        tests:
          - not_null

      - name: avg_review_score
        description: "Average review score (1-5)"

      - name: avg_delivery_days
        description: "Average delivery days"

      - name: preferred_payment_type
        description: "Most used payment mode (ties → alphabetical); 'not_available' if missing"
        tests:
          - not_null
          - accepted_values:
              values: ['unknown', 'boleto', 'debit_card', 'voucher', 'not_available', 'credit_card']

      - name: payment_usage_count
        description: "Times the preferred payment mode was used"
        tests:
          - not_null