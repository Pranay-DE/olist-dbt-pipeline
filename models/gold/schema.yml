version: 2

models:
  - name: olist_master_table
    description: "Wide master table at order-item grain combining all business entities.
                  One row per order_id + product_id combination. Use COUNT(DISTINCT order_id) for order level metrics.
                  Invalid date orders excluded."
    columns:
      - name: order_id
        description: "Order identifier. Not unique at this grain — repeats for each item in the order."
        tests:
          - not_null

      - name: order_item_id
        description: "Item sequence number within order."

      - name: product_id
        description: "Product Identifier"

      - name: customer_id
        description: "Customer identifier per order."
        tests:
          - not_null

      - name: price
        description: "Item price in BRL."

      - name: total_item_value
        description: "Price + freight for this item."

  - name: sales_performance
    description: "Sales performance aggregated by product category, fiscal year and month.
                  Grain: one row per product_category + fiscal_year + order_month."
    columns:
      - name: product_category
        description: "Product category in English."
        tests:
          - not_null

      - name: fiscal_year
        description: "Fiscal Year of Order"
        tests:
          - not_null

      - name: order_month
        description: "Month number of the order (1-12)."
        tests:
          - not_null

      - name: total_orders
        description: "Count of distinct orders for this category/month."
        tests:
          - not_null

      - name: total_revenue
        description: "Sum of item prices (excluding freight)."
        tests:
          - not_null

      - name: total_value
        description: "Sum of items prices (revenue + freight)"
        tests:
          - not_null

  - name: customer_behaviour
    description: "Customer-level behaviour table at customer_unique_id grain.
                  One row per unique customer with aggregated spend, orders, reviews, delivery, and preferred payment method
                  Preferred payment = most frequently used mode; ties broken alphabetically."
    columns:
      - name: customer_unique_id
        description: "True customer identity (primary key)"
        tests:
          - not_null
    
      - name: customer_city
        description: "Customer's city"
        tests:
          - not_null

      - name: customer_state
        description: "Customer's state code"
        tests:
          - not_null

      - name: customer_type
        description: "New Customer or Repeat Customer"
        tests:
          - not_null
          - accepted_values:
              values: ['New Customer', 'Repeat Customer']

      - name: total_spend
        description: "Total lifetime spend by customer"

      - name: total_orders
        description: "Distinct count of customer's orders"
        tests:
          - not_null

      - name: avg_review_score
        description: "Average review score (1-5)"

      - name: avg_delivery_days
        description: "Average delivery days"

      - name: preferred_payment_type
        description: "Most used payment mode (ties → alphabetical); 'not_available' if missing"
        tests:
          - not_null
          - accepted_values:
              values: ['unknown', 'boleto', 'debit_card', 'voucher', 'not_available', 'credit_card']

      - name: payment_usage_count
        description: "Times the preferred payment mode was used"
        tests:
          - not_null
  
  - name: delivery_performance
    description: "Seller-level delivery performance metrics aggregated at seller_id grain.
                  One row per seller. Delivery rates use the INCLUSIVE definition (Not Delivered counted in denominator) to reflect true customer experience.
                  Delivery day metrics only consider orders that were actually delivered."
    columns:
      - name: seller_id
        description: "Unique identifier for each seller. Primary key of this table."
        tests:
          - not_null
          - unique

      - name: seller_city
        description: "City where the seller is located."
        tests:
          - not_null

      - name: seller_state
        description: "State (2-letter code) where the seller is located."
        tests:
          - not_null

      - name: total_orders
        description: "Total distinct orders handled by the seller."
        tests:
          - not_null

      - name: delivered_orders
        description: "Number of orders successfully delivered (on time + late)."
        tests:
          - not_null

      - name: on_time_orders
        description: "Number of orders delivered on or before the estimated delivery date."
        tests:
          - not_null
      
      - name: late_orders
        description: "Number of orders delivered after the estimated delivery date."
        tests:
          - not_null

      - name: not_delivered_orders
        description: "Number of orders that were never delivered (cancelled, lost, or failed)."
        tests:
          - not_null

      - name: on_time_delivery_rate
        description: "Fraction of ALL orders (including not delivered) that were delivered on time. Range 0-1"
        tests:
          - not_null
      
      - name: late_delivery_rate
        description: "Fraction of ALL orders that were delivered late. Range 0-1."
        tests:
          - not_null
      
      - name: not_delivered_rate
        description: "Fraction of ALL orders that were never delivered. Range 0-1."
        tests:
          - not_null
      
      - name: avg_actual_days_to_delievered
        description: "Average number of days taken to deliver an order. NULL if seller has no delivered orders."

      - name: avg_delivery_variance_days
        description: "Average difference between actual and estimated delivery (negative = early, positive = late). NULL if no delivered orders."
      
      - name: avg_review_score
        description: "Average review score (1-5) received across all orders. NULL if seller received no reviews."

      - name: total_review_count
        description: "Number of orders where the seller received a review score."
        tests:
          - not_null