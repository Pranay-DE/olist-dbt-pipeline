version: 2

models:
  - name: orders_clean
    description: "Cleaned and enriched orders data with delivery metrics"
    columns:
      - name: order_id
        description: "Unique Orders Identifier"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null

      - name: order_status
        description: "Raw order status from source"
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled',
                       'unavailable', 'invoiced', 'processing',
                       'created', 'approved']

      - name: order_status_category
        description: "Simplified status category"
        tests:
          - not_null
          - accepted_values:
              values: ['Completed', 'In Progress', 'Canceled']

      - name: ordered_at
        description: "Timestamp when order was placed"
        tests:
          - not_null

      - name: delivery_category
        description: "On Time / Late / Not Delivered"
        tests:
          - not_null
          - accepted_values:
              values: ['Delivered On Time', 'Late', 'Not Delivered']

      - name: is_date_valid
        description: "Whether date sequence is valid"
        tests:
          - not_null
          - accepted_values:
              values: ['VALID', 'Invalid Date']

  - name: customers_clean
    description: "Cleaned customers data with city standardisation and customer type"
    columns:
      - name: customer_id
        description: "Unique identifier per order"
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Unique identifier per person across all orders"
        tests:
          - not_null

      - name: customer_city
        description: "Customer city in lowercase"
        tests:
          - not_null

      - name: customer_state
        description: "Customer state abbreviation"
        tests:
          - not_null

      - name: customer_type
        description: "New Customer or Repeat Customer"
        tests:
          - not_null
          - accepted_values:
              values: ['New Customer', 'Repeat']

  - name: order_items_clean
    description: "Cleaned order items data with duplicates removed, price categorisation and freight analysis. Grain: one row per unique order_id and product_id combination."
    columns:
      - name: order_id
        description: "Foreign key to orders_clean. One order can have multiple items."
        tests:
          - not_null

      - name: order_item_id
        description: "Sequential item number within an order. Starts at 1."
        tests:
          - not_null

      - name: product_id
        description: "Foreign key to products_clean. Identifies the product type sold."
        tests:
          - not_null

      - name: seller_id
        description: "Foreign key to sellers_clean. Identifies who sold this item."
        tests:
          - not_null

      - name: shipping_limit_date
        description: "Deadline by which seller must ship the item to carrier."
        tests:
          - not_null

      - name: price
        description: "Price of the individual item in Brazilian Real (BRL)."
        tests:
          - not_null

      - name: price_category
        description: "Price tier classification based on item price. Low Price Product / Mid Price Product / High Price Product / Premium."
        tests:
          - not_null
          - accepted_values:
              values: ['Low Price Product', 'Mid Price Product', 'High Price Product', 'Premium']

      - name: freight_value
        description: "Shipping cost for this item in Brazilian Real (BRL)."
        tests:
          - not_null

      - name: freight_percentage
        description: "Freight cost as a percentage of total item value (price + freight)."

      - name: total_item_value
        description: "Total cost to customer for this item including freight. Calculated as price + freight_value."
        tests:
          - not_null

  - name: products_clean
    description: "Cleaned products data with English category names, corrected column name typos, and derived volume metric. Grain: one row per product_id."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

      - name: product_category
        description: "Product category in English. Falls back to Portuguese category name if English translation not available. 'Unknown' if no category exists in source."
        tests:
          - not_null

      - name: product_name_length
        description: "Number of characters in product name. Source column typo corrected from 'lenght' to 'length'."

      - name: product_description_length
        description: "Number of characters in product description. Source column typo corrected from 'lenght' to 'length'."

      - name: product_photos_qty
        description: "Number of photos the seller uploaded for this product."

      - name: product_weight_g
        description: "Product weight in grams."

      - name: product_length_cm 
        description: "Product length in centimetres."

      - name: product_height_cm
        description: "Product height in centimetres."
      
      - name: product_width_cm
        description: "Product width in centimetres."
      
      - name: product_volume_cm3
        description: "Derived product volume in cubic centimetres. Calculated as length x height x width. Null when any dimension is null."

  - name: order_payments_clean
    description: "Cleaned payment data with payment type standardisation, installment categorisation and value categorisation.
                  Grain: one row per order_id and payment_sequential combination.
                  One order can have multiple payment methods."
    columns:
      - name: order_id
        description: "Foreign key to orders_clean. One order can have multiple payment rows if paid with multiple methods."
        tests:
          - not_null

      - name: payment_sequential
        description: "Order of payment method used. 1 = primary payment, 2 = secondary payment method etc."
        tests:
          - not_null

      - name: payment_type
        description: "Payment method used. Standardised — not_defined mapped to Unknown."
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'unknown']

      - name: payment_installments
        description: "Number of installments chosen by customer. 1 = paid in full. 0 = not applicable (flagged as suspicious)."
        tests:
          - not_null

      - name: payment_installment_type
        description: "Categorised installment type. Not Applicable / Full Payment / Short Term / Long Term."
        tests:
          - not_null
          - accepted_values:
              values: ['Not Applicable', 'Full Payment', 'Short Term', 'Long Term']

      - name: payment_value
        description: "Payment amount in Brazilian Real (BRL) for this payment method. One order total is sum of all payment_sequential rows."
        tests:
          - not_null

      - name: payment_value_category
        description: "Payment value tier classification. Near Zero / Low / Medium / High."
        tests:
          - not_null
          - accepted_values:
              values: ['Near Zero', 'Low', 'Medium', 'High']